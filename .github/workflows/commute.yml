name: Train delay watch

on:
  # Started by cron-job.org (05:45, 06:45, 15:09, 16:09 Europe/Stockholm, Mon-Fri)
  # via the API, since GitHub's own scheduler was too unreliable. The script picks
  # the right trains for odd/even weeks and exits fast when none is due.
  workflow_dispatch:
    inputs:
      mode:
        description: What to run
        type: choice
        options: [check, test-notify, stations, watch]
        default: check

# Only one watcher at a time, so you never get duplicate notifications
concurrency:
  group: train-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run watcher
        run: python commute.py ${{ inputs.mode || 'watch' }}
        env:
          TRV_API_KEY: ${{ secrets.TRV_API_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
